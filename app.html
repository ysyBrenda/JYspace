<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="origin" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Love Space</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Space+Mono:wght@400;700&family=LXGW+WenKai:wght@400;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">

  <script defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <link rel="stylesheet" href="app.css?v=build20260324a" />
</head>
<body data-page="home">

<header>
  <div class="header-top">
    <div style="width: 44px;"></div>
    <h1><span class="star-icon">✦</span> Love Space <span class="star-icon">✦</span></h1>
    <button class="theme-toggle" onclick="toggleTheme()" title="切换主题">
      <span id="themeIcon">🌙</span>
    </button>
  </div>
  <div class="subtitle" id="subtitle">SY & JY // COSMIC CONNECTION</div>
</header>

<div class="container">

  <!-- 纪念日 -->
  <div class="card">
    <div class="card-title">
      <div class="card-title-left">
        <span id="daysTitle">◈ Timeline</span>
      </div>
    </div>
    <div class="days-grid">
      <div class="day-card">
        <div class="day-label" id="loveLabel">Love</div>
        <div class="day-number" id="loveDays">0</div>
        <div class="day-unit">DAYS</div>
      </div>
      <div class="day-card">
        <div class="day-label" id="meetLabel">Meet</div>
        <div class="day-number" id="knowDays">0</div>
        <div class="day-unit">DAYS</div>
      </div>
    </div>
  </div>

  <!-- 倒计时 -->
  <div class="card countdown-wrapper" style="padding: 0; background: transparent; border: none; box-shadow: none;">
    <div class="countdown-box">
      <div class="countdown-label" id="countdownLabel">◆ 💍Countdown ◆</div>
      <div class="countdown-number" id="countdown">0</div>
      <div class="countdown-text" id="countdownText">
<!--        在一起第 <span id="countdownDays">0</span> 天<br>-->
        <div class="day-unit">DAYS</div>
        <span style="font-size: 11px; opacity: 0.7; margin-top: 8px; display: inline-block;">💫 Every day is worth celebrating 💫</span>
      </div>
    </div>
  </div>

  <!-- 留言区 -->
  <div class="card">
    <div class="card-title">
      <div class="card-title-left">
        <span id="msgTitle">◉ Transmission</span>
        <span class="list-stats" id="msgStats"></span>
      </div>
      <a class="more-link" href="messages.html" title="查看全部留言">MORE</a>
    </div>

    <div id="msgContent">
      <div class="input-group">
        <select id="author" onchange="setCurrentUser()">
          <option value="">选择身份</option>
          <option value="SY">SY</option>
          <option value="JY">JY</option>
        </select>
        <div class="input-row">
          <input id="messageText" placeholder="输入消息..." style="flex: 1;" />
          <button class="btn" onclick="addMessage()" style="width: auto;">发送</button>
        </div>
      </div>

      <ul id="messages" class="message-list"></ul>
    </div>
  </div>

  <!-- 时间轴 -->
  <div class="card">
    <div class="card-title">
      <div class="card-title-left">
        <span id="timelineTitle">◎ Star Map</span>
        <span class="list-stats" id="timelineStats"></span>
      </div>
      <a class="more-link" href="timeline.html" title="查看全部时间轴">MORE</a>
    </div>

    <div id="timelineContent">
      <div class="input-group">
        <input id="eventText" placeholder="记录事件..." />
        <div class="input-row">
          <input id="eventDate" type="date" style="flex: 1;" />
          <button class="btn btn-secondary" onclick="addEvent()" style="width: auto;">记录</button>
        </div>
      </div>

      <div class="timeline-container" id="timelineContainer">
        <ul id="timeline" class="timeline-list"></ul>
      </div>
    </div>
  </div>

</div>
  <script defer src="firebase.js?v=build20260324a"></script>
  <script defer src="app.js?v=build20260324a"></script>
</body>

</html>
